name: Build and deploy

# Every CMS save is a commit, and a commit is the only thing that regenerates
# the site — Astro turns content files into HTML at build time, so without this
# workflow a published edit would sit in the repo and never reach the site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Rapid saves supersede each other — each is a commit on top of the last, so
    # the newest build already contains the older ones. Cancelling redundant
    # BUILDS is safe. Cancelling a deploy is not; see the deploy job below.
    concurrency:
      group: build-pages
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Astro reprocesses every image from scratch unless this survives —
      # measured at 18s cold vs 9.5s warm on this project. Keyed on the images
      # alone, so an ordinary content edit gets an exact hit and only a new or
      # changed photo invalidates it.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/uploads/**') }}
          restore-keys: astro-assets-

      # Builds the CMS preview bundle, then the site.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Deliberately NOT cancel-in-progress: killing a deploy mid-flight can leave
    # Pages in a half-published state. Queued deploys are skipped instead, which
    # is fine — the newest build is the one that matters.
    concurrency:
      group: deploy-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
